name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cinerent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cinerent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - name: Los datos de ejemplo se cargan y se pueden repetir
        run: npm run seed && npm run seed
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: solo-para-la-ci

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: docker compose exec -T api node prisma/seed.js
      - name: El catálogo responde con datos
        run: curl -fsS http://127.0.0.1:4000/api/movie/all-movies | grep -q Nebulosa
      - if: failure()
        run: docker compose logs
